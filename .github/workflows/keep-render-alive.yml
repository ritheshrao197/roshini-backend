name: Keep Render Backend Alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Random delay (0-5 minutes)
        run: |
          DELAY=$((RANDOM % 301))
          echo "Waiting ${DELAY}s..."
          sleep $DELAY

      - name: Ping Render backend
        env:
          BASE_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          HEALTH_URL="${BASE_URL}/health"

          echo "Pinging: $HEALTH_URL"

          STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            "$HEALTH_URL")

          echo "HTTP Status: $STATUS"

          if [[ "$STATUS" =~ ^2[0-9]{2}$ ]]; then
            echo "✅ Backend is healthy."
          elif [[ "$STATUS" =~ ^4[0-9]{2}$ ]]; then
            echo "⚠️ Backend responded with a client error ($STATUS), but it is reachable."
          else
            echo "❌ Backend is unavailable (HTTP $STATUS)."
            exit 1
          fi
